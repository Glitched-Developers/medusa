org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# ВАЖНО: отключаем R8-минификацию release-сборки.
# Плагин Flutter (FlutterPluginUtils.shouldShrinkResources) включает R8 по умолчанию,
# а R8 переименовывает типы в JNI-сигнатурах методов (kotlin.coroutines.Continuation -> x0.d).
# Плагины на Pigeon KT-FFI/JNI (shared_preferences) ищут свои методы по точной JNI-сигнатуре,
# получают NoSuchMethodError, их Future никогда не завершается, инициализация в main() виснет
# и приложение не рисует первый кадр (чёрный/белый экран при запуске).
shrink=false
